<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001E62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UK Hoops">
<title>Kentucky Basketball 2026–27</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230033A0'/%3E%3Cpath d='M32 2v60M2 32h60M12 10c12 10 12 34 0 44M52 10c-12 10-12 34 0 44' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0033A0; --blue-deep:#001E62; --maple:#E7C9A0; --maple-dark:#B98D58;
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E9EDF6; --text:#0E1630; --muted:#5A6482;
  --line:#D5DBEA; --win:#127A3E; --loss:#B4232F; --live:#E0182D; --accent:#0033A0;
  --board:#05113A; --board-text:#FFFFFF; --amber:#FFC42E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070D22; --surface:#0F1834; --surface-2:#16224A; --text:#EEF2FF; --muted:#9AA6C8;
    --line:#24315C; --win:#3DD07D; --loss:#FF6B76; --accent:#6E9BFF; --board:#020821; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070D22; --surface:#0F1834; --surface-2:#16224A; --text:#EEF2FF; --muted:#9AA6C8;
  --line:#24315C; --win:#3DD07D; --loss:#FF6B76; --accent:#6E9BFF; --board:#020821; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--blue-deep)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
img{max-width:100%}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--blue-deep);color:#fff;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 38px,rgba(0,0,0,.05) 38px 76px)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.mark{width:38px;height:38px;flex:none}
.top h1{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.5px;margin:0;line-height:1}
.top small{display:block;font-size:13px;opacity:.8;font-weight:500;margin-top:2px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;border:0}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;color:#fff;font-size:18px}
nav.tabs{display:flex;max-width:1100px;margin:0 auto;padding:0 8px;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.75);padding:10px 12px 11px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--maple)}

main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.banner{background:#FFF4D6;color:#5B4300;border:1px solid #F0D58A;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;font-size:14px}
.banner button{margin-left:auto;background:#5B4300;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:600}
h2{font-family:var(--display);font-weight:800;font-size:30px;margin:26px 0 10px;line-height:1.05}
h2:first-child{margin-top:4px}
h3{font-size:17px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Scoreboard (signature element) */
.board{background:var(--board);color:var(--board-text);border-radius:18px;padding:18px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),0 10px 30px rgba(0,20,80,.25)}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px) 0 0/6px 6px}
.board-status{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#C9D4FF;position:relative;z-index:1}
.livedot{width:10px;height:10px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(224,24,45,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(224,24,45,0)}100%{box-shadow:0 0 0 0 rgba(224,24,45,0)}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.board-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:12px;position:relative;z-index:1}
.bteam{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.bteam img,.bteam .logo-fallback{width:56px;height:56px;object-fit:contain}
.bteam .nm{font-weight:700;font-size:15px;line-height:1.15}
.bteam .rk{font-size:12px;color:var(--amber);font-weight:700}
.bscore{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;color:var(--amber);letter-spacing:1px;
  text-shadow:0 0 18px rgba(255,196,46,.35);display:flex;gap:16px;align-items:center;font-variant-numeric:tabular-nums}
.bscore .dash{font-size:30px;color:#6C7BB0}
.bscore.pre{font-size:34px;color:#fff;text-shadow:none;text-align:center;display:block}
.board-meta{text-align:center;margin-top:12px;font-size:14px;color:#C9D4FF;position:relative;z-index:1}
.board-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--maple);color:#2A1A05}
.board .btn{background:rgba(255,255,255,.12);color:#fff}
.board .btn.primary{background:var(--maple);color:#2A1A05}
.linescore{margin:14px auto 0;border-collapse:collapse;font-variant-numeric:tabular-nums;position:relative;z-index:1;font-size:14px}
.linescore th,.linescore td{padding:3px 10px;text-align:center}
.linescore th{color:#8C9AD0;font-weight:600}
.linescore td:first-child{text-align:left;font-weight:700}

/* Generic layout */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.leader{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.leader .v{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--accent)}
.leader .l{font-size:13px;color:var(--muted);font-weight:600}
.leader .n{font-weight:700;font-size:15px}
.recline{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.recline .chip{background:var(--surface-2);color:var(--text)}

.avatar{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;object-position:top;background:var(--surface-2)}
.initials{display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:linear-gradient(140deg,var(--blue),var(--blue-deep))}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{white-space:nowrap;border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=search],select{font:inherit;font-size:15px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=search]{flex:1;min-width:160px}

/* Roster */
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.prow .num{font-family:var(--display);font-weight:900;font-size:13px;color:var(--maple-dark)}
.prow .nm{font-weight:700;font-size:16px;line-height:1.2}
.prow .sub{font-size:13px;color:var(--muted)}
.prow .from{font-size:13px;margin-top:2px}
.prow .ppg{text-align:right;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.prow .ppg span{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
.ava-wrap{position:relative}
.ava-wrap .jn{position:absolute;bottom:-4px;right:-6px;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:13px;border-radius:7px;padding:0 5px;border:2px solid var(--surface)}

/* Schedule */
.month{font-family:var(--display);font-weight:800;font-size:20px;margin:18px 0 8px;color:var(--muted)}
.grow{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%;margin-bottom:8px}
.grow .dt{text-align:center;line-height:1.05}
.grow .dt b{display:block;font-family:var(--display);font-size:24px;font-weight:900}
.grow .dt span{font-size:12px;color:var(--muted);font-weight:600}
.grow .op{display:flex;align-items:center;gap:10px;min-width:0}
.grow .op img{width:30px;height:30px;object-fit:contain;flex:none}
.grow .op .t{font-weight:700;line-height:1.2}
.grow .op .s{font-size:13px;color:var(--muted)}
.res{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.res.w{color:var(--win)} .res.l{color:var(--loss)}
.res .tag{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.res.live{color:var(--live)}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.stats{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.stats th,table.stats td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line)}
table.stats th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
table.stats th button{background:none;border:0;padding:0;font-weight:700;color:inherit}
table.stats th.sorted{color:var(--accent)}
table.stats td:first-child,table.stats th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.stats th:first-child{background:var(--surface-2);z-index:2}
table.stats tr.tot td{font-weight:800;background:var(--surface-2)}
table.stats tr.tot td:first-child{background:var(--surface-2)}
table.stats tr.dnp td{color:var(--muted)}
table.stats .pl{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;font-weight:600}
table.stats .pl img,table.stats .pl .initials{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top;font-size:11px}
.starter{font-size:10px;font-weight:800;color:#2A1A05;background:var(--maple);border-radius:4px;padding:0 4px;margin-left:6px}

/* Compare bars */
.cmp{display:grid;gap:12px}
.cmp-row .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cmp-row .lbl span:nth-child(2){color:var(--muted);font-weight:600}
.bars{display:flex;gap:3px;height:9px;margin-top:4px}
.bars i{display:block;border-radius:5px;background:var(--blue)}
.bars i+i{background:#9AA6C8}

/* Sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(3,8,30,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow:auto;border-radius:20px 20px 0 0;
  padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:860px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
.sheet-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{background:var(--surface-2);border:0;border-radius:10px;width:36px;height:36px;font-size:18px}
.sheet-body{padding:16px}

.phero{display:flex;gap:16px;align-items:center}
.phero .big.initials{background:linear-gradient(140deg,var(--blue),var(--blue-deep))}
.phero .big{width:110px;height:110px;border-radius:18px;object-fit:cover;object-position:top;background:var(--surface-2);font-size:40px}
.phero .jn{font-family:var(--display);font-weight:900;font-size:22px;color:var(--maple-dark)}
.phero h2{margin:0;font-size:34px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.facts span{background:var(--surface-2);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.path .stop{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600}
.path .stop.uk{background:var(--blue);color:#fff;border-color:var(--blue)}
.path .arr{color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:28px;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:8px}
.yt{background:#C4302B;color:#fff}
.xbtn{background:#111827;color:#fff}

.plays{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.play{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.play:last-child{border-bottom:0}
.play .clk{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.play.sc{font-weight:700}
.play .scr{font-variant-numeric:tabular-nums;font-weight:700}

.staff{display:flex;gap:14px;align-items:flex-start}
.staff .initials{width:52px;height:52px;border-radius:14px;font-size:20px;flex:none}
.staff .role{font-size:13px;font-weight:700;color:var(--maple-dark)}
.pos{color:var(--win)} .neg{color:var(--loss)} em.pos,em.neg,.stat em{font-style:normal}
.gloss summary{cursor:pointer} .gloss dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.gloss dt{font-weight:700} .gloss dd{margin:0;color:var(--muted)}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.updated{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;height:70px;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:520px){
  .bscore{font-size:48px;gap:10px}
  .bteam img,.bteam .logo-fallback{width:44px;height:44px}
  .phero .big{width:86px;height:86px}
  .phero h2{font-size:28px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#0033A0" stroke="#E7C9A0" stroke-width="3"/><path d="M32 3v58M3 32h58M13 11c11 10 11 32 0 42M51 11c-11 10-11 32 0 42" stroke="#fff" stroke-width="2.6" fill="none"/></svg>
    <div>
      <h1>Kentucky Basketball</h1>
      <small id="subline">2026–27 season</small>
    </div>
    <div class="sp"></div>
    <button class="iconbtn" id="installBtn" title="Install app" aria-label="Install app" hidden>⤓</button>
    <button class="iconbtn" id="refreshBtn" title="Refresh live data" aria-label="Refresh live data">⟳</button>
    <button class="iconbtn" id="themeBtn" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-view="home" aria-selected="true">Home</button>
    <button role="tab" data-view="roster" aria-selected="false">Roster</button>
    <button role="tab" data-view="schedule" aria-selected="false">Schedule</button>
    <button role="tab" data-view="stats" aria-selected="false">Stats</button>
    <button role="tab" data-view="staff" aria-selected="false">Coaches</button>
  </nav>
</header>
<main id="app"></main>
<div id="sheetRoot"></div>

<script>
/* ============ CONFIG ============ */

 {n:'Zoom Diallo',j:'5',pos:'G',ht:'6-4',wt:180,cl:'Jr.',home:'Tacoma, WA',path:['Washington'],prev:'15.7 PPG, 4.5 APG, 3.9 RPG at Washington',note:''},

 {n:'Alex Wilkins',j:'10',pos:'G',ht:'6-5',wt:175,cl:'So.',home:'Mattapan, MA',path:['Furman'],prev:'17.8 PPG, 4.7 APG, 2.0 RPG at Furman',note:''},

async function getJSON(url, ms=12000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, {signal:ctl.signal, cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

function parseEvent(e){
  const c = e.competitions?.[0] || {};
  const comps = c.competitors || [];
  const us = comps.find(x => String(x.team?.id ?? x.id) === TEAM_ID) || comps[0] || {};
  const them = comps.find(x => x !== us) || {};
  const st = c.status?.type || e.status?.type || {};
  const t = them.team || {};
  return {
    id:String(e.id), date:e.date, state:st.state || 'pre', completed:!!st.completed,
    detail:st.shortDetail || st.detail || '', clock:c.status?.displayClock, period:c.status?.period,
    homeAway:us.homeAway, neutral:!!c.neutralSite,
    venue:c.venue?.fullName || '', city:[c.venue?.address?.city, c.venue?.address?.state].filter(Boolean).join(', '),
    tv:(c.broadcasts?.[0]?.media?.shortName) || (c.broadcasts?.[0]?.names?.[0]) || '',
    seasonType:e.seasonType?.type,
    opp:{ id:String(t.id||''), name:t.displayName || t.location || 'Opponent', short:t.shortDisplayName || t.location || t.abbreviation || 'Opp',
      abbr:t.abbreviation || '', logo:t.logos?.[0]?.href || t.logo || '', rank:them.curatedRank?.current && them.curatedRank.current<26 ? them.curatedRank.current : null },
    usRank:us.curatedRank?.current && us.curatedRank.current<26 ? us.curatedRank.current : null,
    us:scoreOf(us.score), them:scoreOf(them.score), win: us.winner === true ? true : (them.winner === true ? false : null),
    conf: !!c.conferenceCompetition
  };
}

const LABEL_MAP = {MIN:'min',OREB:'oreb',DREB:'dreb',REB:'reb',AST:'ast',STL:'stl',BLK:'blk',TO:'to',PF:'pf',PTS:'pts','+/-':'pm'};
const PAIR_MAP = {FG:['fgm','fga'],'3PT':['tpm','tpa'],FT:['ftm','fta']};
function statsFrom(labels, vals){
  const o = {min:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,reb:0,ast:0,stl:0,blk:0,to:0,pf:0,pts:0};
  (labels||[]).forEach((l,i)=>{
    const v = vals?.[i]; const L = String(l).toUpperCase();
    if(PAIR_MAP[L]){ const [m,a] = String(v||'0-0').split('-'); o[PAIR_MAP[L][0]] = num(m); o[PAIR_MAP[L][1]] = num(a); }
    else if(LABEL_MAP[L]) o[LABEL_MAP[L]] = num(v);
  });
  return o;
}
function parseSummary(sum){
  const comp = sum.header?.competitions?.[0] || {};
  const st = comp.status?.type || {};
  const teams = (comp.competitors || []).map(c => ({
    id:String(c.team?.id||c.id), name:c.team?.displayName || c.team?.location, short:c.team?.shortDisplayName || c.team?.abbreviation,
    abbr:c.team?.abbreviation, logo:c.team?.logos?.[0]?.href || c.team?.logo, homeAway:c.homeAway, score:num(c.score),
    rank:c.rank && c.rank<26 ? c.rank : null, lines:(c.linescores||[]).map(x=>num(x.displayValue ?? x.value)), players:[], totals:null
  }));
  (sum.boxscore?.players || []).forEach(bp => {
    const tm = teams.find(t => t.id === String(bp.team?.id)); if(!tm) return;
    const grp = bp.statistics?.[0]; if(!grp) return;
    const labels = grp.labels || grp.names || [];
    tm.players = (grp.athletes||[]).map(a => ({
      id:String(a.athlete?.id||''), name:a.athlete?.displayName || a.athlete?.shortName || '', jersey:a.athlete?.jersey || '',
      pos:a.athlete?.position?.abbreviation || '', headshot:a.athlete?.headshot?.href || '',
      starter:!!a.starter, dnp:!!a.didNotPlay || !(a.stats && a.stats.length), ...statsFrom(labels, a.stats)
    }));
    if(grp.totals && grp.totals.length) tm.totals = statsFrom(labels, grp.totals);
    else { const t = statsFrom([],[]); tm.players.forEach(p=>{ for(const k in t) t[k]+=p[k]||0; }); tm.totals = t; }
  });
  computePlusMinus(sum.plays || [], teams);
  teams.forEach(t => { t.ot = Math.max(0, t.lines.length - 2); t.min = 200 + 25*t.ot; });
  const teamStats = [];
  const bt = sum.boxscore?.teams || [];
  if(bt.length === 2){
    const a = bt.find(t=>String(t.team?.id)===TEAM_ID) || bt[0], b = bt.find(t=>t!==a);
    (a.statistics||[]).forEach(s => {
      const o = (b.statistics||[]).find(x => x.name === s.name);
      if(o) teamStats.push({label:s.label || s.name, us:s.displayValue, them:o.displayValue, name:s.name});
    });
  }
  const plays = (sum.plays || []).slice(-60).reverse().map(p => ({
    text:p.text, clock:p.clock?.displayValue, period:p.period?.number, scoring:!!p.scoringPlay,
    home:p.homeScore, away:p.awayScore, team:String(p.team?.id||'')
  }));
  return {
    state:st.state || 'pre', completed:!!st.completed, detail:st.shortDetail || st.detail || '', teams, teamStats, plays,
    venue:sum.gameInfo?.venue?.fullName || '', attendance:sum.gameInfo?.attendance || null,
    tv:(comp.broadcasts?.[0]?.media?.shortName) || '', updated:Date.now()
  };
}

/* Plus/minus: ESPN's college box scores usually don't include it, so it's rebuilt from
   play-by-play: start with the five starters, follow every substitution, and credit each
   scoring change to the players on the floor. */
function computePlusMinus(plays, teams){
  if(teams.length!==2 || !plays.length) return;
  if(teams.some(t=>t.players.some(p=>typeof p.pm==='number'))) return; // ESPN supplied it
  const home = teams.find(t=>t.homeAway==='home'), away = teams.find(t=>t.homeAway==='away');
  if(!home || !away) return;
  const find = name => {
    const k = norm(name);
    for(const t of teams){
      let p = t.players.find(x=>norm(x.name)===k);
      if(!p){ const last = norm(String(name).trim().split(/\s+/).pop()); const c = t.players.filter(x=>norm(String(x.name).split(' ').pop())===last); if(c.length===1) p = c[0]; }
      if(p) return {t,p};
    }
    return null;
  };
  const on = new Map(teams.map(t=>[t, new Set(t.players.filter(p=>p.starter).map(p=>p.name))]));
  teams.forEach(t=>t.players.forEach(p=>{ p._pm = 0; }));
  const RX = [/^(.+?) enters the game for (.+?)\.?$/i, /^(.+?) subbing in for (.+?)\.?$/i, /^substitution:?\s*(.+?) in for (.+?)\.?$/i, /^(.+?) in for (.+?)\.?$/i];
  const RXIN = /^(.+?) (?:enters the game|subbing in|checks in)\.?$/i, RXOUT = /^(.+?) (?:goes to the bench|subbing out|exits the game|checks out)\.?$/i;
  let subs = 0, ph = 0, pa = 0;
  for(const pl of plays){
    const txt = String(pl.text||'').trim(); let m = null;
    for(const r of RX){ m = txt.match(r); if(m) break; }
    if(m){ const a = find(m[1]), b = find(m[2]); if(a){ on.get(a.t).add(a.p.name); subs++; } if(b) on.get(b.t).delete(b.p.name); }
    else if((m = txt.match(RXIN))){ const a = find(m[1]); if(a){ on.get(a.t).add(a.p.name); subs++; } }
    else if((m = txt.match(RXOUT))){ const a = find(m[1]); if(a){ on.get(a.t).delete(a.p.name); subs++; } }
    if(pl.homeScore!=null && pl.awayScore!=null){
      const h = num(pl.homeScore), aw = num(pl.awayScore), net = (h-ph) - (aw-pa);
      if(h!==ph || aw!==pa){
        home.players.forEach(p=>{ if(on.get(home).has(p.name)) p._pm += net; });
        away.players.forEach(p=>{ if(on.get(away).has(p.name)) p._pm -= net; });
        ph = h; pa = aw;
      }
    }
  }
  const ok = subs >= 2;
  teams.forEach(t=>t.players.forEach(p=>{ if(ok && !p.dnp) p.pm = p._pm; delete p._pm; }));
}

/* ============ ADVANCED STAT FORMULAS ============ */
const poss = t => t ? (t.fga - t.oreb + t.to + 0.475*t.fta) : 0;
const gameScore = s => s.pts + 0.4*s.fgm - 0.7*s.fga - 0.4*(s.fta-s.ftm) + 0.7*s.oreb + 0.3*s.dreb + s.stl + 0.7*s.ast + 0.7*s.blk - 0.4*s.pf - s.to;
function advFor(t, A, gp){
  const m = t.min, tm5 = A.tmin/5, ok = m && A.tmin;
  return {
    ts: (t.fga+0.44*t.fta) ? t.pts/(2*(t.fga+0.44*t.fta))*100 : null,
    efg: t.fga ? (t.fgm+0.5*t.tpm)/t.fga*100 : null,
    usg: ok && (A.tfga+0.44*A.tfta+A.tto) ? 100*((t.fga+0.44*t.fta+t.to)*tm5)/(m*(A.tfga+0.44*A.tfta+A.tto)) : null,
    ast: ok && ((m/tm5)*A.tfgm - t.fgm) > 0 ? 100*t.ast/((m/tm5)*A.tfgm - t.fgm) : null,
    reb: ok && (A.treb+A.otreb) ? 100*(t.reb*tm5)/(m*(A.treb+A.otreb)) : null,
    orb: ok && (A.toreb+A.odreb) ? 100*(t.oreb*tm5)/(m*(A.toreb+A.odreb)) : null,
    drb: ok && (A.tdreb+A.ooreb) ? 100*(t.dreb*tm5)/(m*(A.tdreb+A.ooreb)) : null,
    stl: ok && A.oposs ? 100*(t.stl*tm5)/(m*A.oposs) : null,
    blk: ok && (A.ofga-A.otpa) ? 100*(t.blk*tm5)/(m*(A.ofga-A.otpa)) : null,
    tov: (t.fga+0.44*t.fta+t.to) ? 100*t.to/(t.fga+0.44*t.fta+t.to) : null,
    astto: t.to ? t.ast/t.to : (t.ast ? t.ast : null),
    tpar: t.fga ? t.tpa/t.fga*100 : null,
    ftr: t.fga ? t.fta/t.fga*100 : null,
    gmsc: gp ? A.gs/gp : null,
    pm: A.pmg ? A.pm : null, pmpg: A.pmg ? A.pm/A.pmg : null,
    p40: m ? t.pts/m*40 : null, r40: m ? t.reb/m*40 : null, a40: m ? t.ast/m*40 : null
  };
}

/* ============ LOADING ============ */
async function loadAll(){
  S.error = null;
  const [team, sched, roster] = await Promise.allSettled([
    getJSON(`${API}/teams/${TEAM_ID}`),
    getJSON(`${API}/teams/${TEAM_ID}/schedule`),
    getJSON(`${API}/teams/${TEAM_ID}/roster`)
  ]);
  if(team.status==='fulfilled') S.team = team.value.team || null;
  if(sched.status==='fulfilled' && sched.value.events?.length){
    S.events = sched.value.events.map(parseEvent).sort((a,b)=>new Date(a.date)-new Date(b.date));
  } else if(!S.events.length){
    S.events = fallbackEvents();
    S.error = 'Live ESPN data didn’t load, so you’re seeing the saved schedule. Check your connection and refresh.';
  }
  if(roster.status==='fulfilled'){
    const ath = roster.value.athletes || [];
    const flat = ath.flatMap(a => a.items ? a.items : [a]);
    S.roster = flat.map(a => ({ id:String(a.id), name:a.displayName || a.fullName, jersey:a.jersey, pos:a.position?.abbreviation,
      headshot:a.headshot?.href || (a.id ? `https://a.espncdn.com/i/headshots/mens-college-basketball/players/full/${a.id}.png` : ''),
      ht:a.displayHeight, wt:a.displayWeight, cl:a.experience?.displayValue }));
  }
  await loadBoxScores();
  build();
  S.loading = false; S.lastUpdate = new Date();
  render(); schedule();
}
function loadCached(id){ try{ const v = localStorage.getItem(CACHE_KEY+id); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function saveCached(id, box){ try{ localStorage.setItem(CACHE_KEY+id, JSON.stringify({...box, plays:box.plays.slice(0,60)})); }catch(e){} }
async function loadBoxScores(force){
  const need = S.events.filter(e => !e.fallback && (e.state==='post' || e.state==='in'));
  await Promise.all(need.map(async e => {
    if(e.state==='post' && !force && !S.box[e.id]){ const c = loadCached(e.id); if(c && c.completed){ S.box[e.id] = c; return; } }
    if(e.state==='post' && S.box[e.id]?.completed && !force) return;
    try{
      const sum = await getJSON(`${API}/summary?event=${e.id}`);
      const b = parseSummary(sum); S.box[e.id] = b;
      if(b.completed) saveCached(e.id, b);
    }catch(err){ /* leave as-is */ }
  }));
}
async function refreshLive(){
  try{
    const sched = await getJSON(`${API}/teams/${TEAM_ID}/schedule`);
    if(sched.events?.length) S.events = sched.events.map(parseEvent).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const live = S.events.filter(e => e.state==='in');
    // also re-pull games that just ended but aren't marked final in the cache
    const justDone = S.events.filter(e => e.state==='post' && !(S.box[e.id]?.completed));
    await Promise.all([...live, ...justDone].map(async e => {
      try{ const b = parseSummary(await getJSON(`${API}/summary?event=${e.id}`)); S.box[e.id] = b; if(b.completed) saveCached(e.id,b); }catch(err){}
    }));
    S.error = null; build(); S.lastUpdate = new Date(); render(true);
  }catch(err){ /* keep showing last data */ }
  schedule();
}
function schedule(){
  clearTimeout(S.timer);
  const live = S.events.some(e => e.state==='in');
  const soon = S.events.some(e => e.state==='pre' && Math.abs(new Date(e.date) - Date.now()) < 45*60000);
  S.timer = setTimeout(refreshLive, live ? LIVE_MS : soon ? 60000 : IDLE_MS);
}

/* ============ BUILD PLAYERS + TEAM STATS ============ */
function build(){
  const byName = new Map(); const byId = new Map();
  const players = BIO.map(b => ({...b, name:b.n, key:norm(b.n), id:'', headshot:'', log:[], tot:null}));
  players.forEach(p => byName.set(p.key, p));
  S.roster.forEach(r => {
    let p = byName.get(norm(r.name));
    if(!p) p = players.find(x => x.j === String(r.jersey) && norm(x.n).slice(-5) === norm(r.name).slice(-5));
    if(!p){ p = {n:r.name,name:r.name,key:norm(r.name),j:String(r.jersey||''),pos:(r.pos||'').charAt(0),ht:r.ht||'',wt:'',cl:r.cl||'',home:'',path:[],prev:'',note:'',log:[],tot:null,extra:true}; players.push(p); byName.set(p.key,p); }
    p.id = r.id; p.headshot = r.headshot; if(r.jersey) p.j = String(r.jersey);
    byId.set(r.id, p);
  });
  const agg = {gp:0,w:0,l:0,tmin:0,us:blank(),them:blank()};
  S.events.forEach(e => {
    const b = S.box[e.id]; if(!b || !b.teams.length) return;
    const ukT = b.teams.find(t=>t.id===TEAM_ID); const opT = b.teams.find(t=>t.id!==TEAM_ID);
    if(!ukT) return;
    if(b.completed){
      agg.gp++; agg.tmin += ukT.min||200; if(ukT.score>opT?.score) agg.w++; else agg.l++;
      addTo(agg.us, ukT.totals); addTo(agg.them, opT?.totals);
    }
    ukT.players.forEach(bp => {
      let p = byId.get(bp.id) || byName.get(norm(bp.name));
      if(!p){ p = {n:bp.name,name:bp.name,key:norm(bp.name),j:bp.jersey,pos:(bp.pos||'').charAt(0),ht:'',cl:'',home:'',path:[],prev:'',note:'',log:[],tot:null,id:bp.id,headshot:bp.headshot,extra:true}; players.push(p); byName.set(p.key,p); if(bp.id) byId.set(bp.id,p); }
      if(!p.headshot && bp.headshot) p.headshot = bp.headshot;
      if(!p.id && bp.id){ p.id = bp.id; byId.set(bp.id,p); }
      p.log.push({e, b, s:bp, live:!b.completed, tm:ukT.totals, op:opT?.totals, tmin:ukT.min||200});
    });
  });
  players.forEach(p => {
    const t = blank(); let gp = 0, gs = 0;
    const A = {tfga:0,tfta:0,tto:0,tfgm:0,treb:0,toreb:0,tdreb:0,otreb:0,ooreb:0,odreb:0,oposs:0,ofga:0,otpa:0,tmin:0,gs:0,pm:0,pmg:0};
    p.log.forEach(g => { if(!g.s.dnp) g.gmsc = gameScore(g.s); });
    p.log.filter(g => !g.s.dnp && g.s.min > 0).forEach(g => {
      addTo(t, g.s); gp++; if(g.s.starter) gs++;
      A.gs += g.gmsc; if(typeof g.s.pm==='number'){ A.pm += g.s.pm; A.pmg++; }
      if(g.tm){ A.tfga+=g.tm.fga; A.tfta+=g.tm.fta; A.tto+=g.tm.to; A.tfgm+=g.tm.fgm; A.treb+=g.tm.reb; A.toreb+=g.tm.oreb; A.tdreb+=g.tm.dreb; A.tmin+=g.tmin; }
      if(g.op){ A.otreb+=g.op.reb; A.ooreb+=g.op.oreb; A.odreb+=g.op.dreb; A.oposs+=poss(g.op); A.ofga+=g.op.fga; A.otpa+=g.op.tpa; }
    });
    p.tot = {...t, gp, gs};
    p.adv = advFor(t, A, gp);
    p.ppg = gp ? t.pts/gp : 0; p.rpg = gp ? t.reb/gp : 0; p.apg = gp ? t.ast/gp : 0;
  });
  S.players = players; S.teamAgg = agg;
}
function blank(){ return {min:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,reb:0,ast:0,stl:0,blk:0,to:0,pf:0,pts:0}; }
function addTo(a,b){ if(!b) return; for(const k in a) a[k] += num(b[k]); }

/* ============ RECORD / HEADER ============ */
function record(){
  const rec = S.team?.record?.items?.find(i=>i.type==='total')?.summary || S.team?.record?.items?.[0]?.summary;
  if(rec) return rec;
  const done = S.events.filter(e=>e.state==='post' && e.win!=null);
  return `${done.filter(e=>e.win).length}-${done.filter(e=>!e.win).length}`;
}
function confRecord(){
  const it = S.team?.record?.items?.find(i => /conf/i.test(i.type||'') || /conf/i.test(i.description||''));
  return it?.summary || '';
}
function rank(){ const ev = S.events.find(e=>e.state!=='post' && e.usRank) || [...S.events].reverse().find(e=>e.usRank); if(ev) return ev.usRank; const r = S.team?.rank; return r && r < 26 ? r : null; }
function updateHeader(){
  const r = rank(); const cr = confRecord();
  $('#subline').textContent = `${r ? 'No. '+r+' · ' : ''}${record()}${cr ? ' ('+cr+' SEC)' : ''} · 2026–27`;
}

/* ============ RENDER ============ */
function render(soft){
  updateHeader();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view===S.view));
  const app = $('#app');
  let html = '';
  if(S.error) html += `<div class="banner" role="status">${esc(S.error)}<button onclick="hardRefresh()">Retry</button></div>`;
  if(S.loading) html += '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  else html += ({home:viewHome, roster:viewRoster, schedule:viewSchedule, stats:viewStats, staff:viewStaff}[S.view])();
  if(S.lastUpdate) html += `<p class="updated">Updated ${S.lastUpdate.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'})} · Stats from ESPN</p>`;
  const keepFocus = soft && document.activeElement && document.activeElement.id;
  const scrollY = window.scrollY;
  app.innerHTML = html;
  if(keepFocus){ const el = document.getElementById(keepFocus); if(el){ el.focus(); if(el.setSelectionRange && el.value!=null){ const n=el.value.length; el.setSelectionRange(n,n);} } }
  if(soft) window.scrollTo(0, scrollY);
  if(S.sheet && soft) openSheet(S.sheet, true);
}

function boardHTML(e, compact){
  if(!e) return '';
  const b = S.box[e.id];
  const live = e.state==='in'; const post = e.state==='post';
  const usName = 'Kentucky';
  const ukLogo = S.team?.logos?.[0]?.href || 'https://a.espncdn.com/i/teamlogos/ncaa/500/96.png';
  const home = e.homeAway==='home';
  const left = home ? {n:e.opp.short,l:e.opp.logo,r:e.opp.rank,s:e.them} : {n:usName,l:ukLogo,r:e.usRank||rank(),s:e.us};
  const right = home ? {n:usName,l:ukLogo,r:e.usRank||rank(),s:e.us} : {n:e.opp.short,l:e.opp.logo,r:e.opp.rank,s:e.them};
  if(b && b.teams.length===2){
    const away = b.teams.find(t=>t.homeAway==='away') || b.teams[0], hm = b.teams.find(t=>t!==away);
    left.s = away.score; right.s = hm.score;
  }
  let status;
  if(live) status = `<span class="livedot" aria-hidden="true"></span> Live · ${esc(b?.detail || e.detail)}`;
  else if(post) status = `Final${/OT/.test(e.detail)?' · '+esc(e.detail.replace(/^Final\/?/,'')):''} · ${esc(shortDate(e.date))}`;
  else status = `Next game · ${esc(shortDate(e.date))}`;
  const center = (live||post)
    ? `<div class="bscore" aria-label="Score ${left.s} to ${right.s}"><span>${left.s ?? 0}</span><span class="dash">–</span><span>${right.s ?? 0}</span></div>`
    : `<div class="bscore pre">${e.fallback && /TBA/.test(e.detail) ? 'TBA' : esc(timeStr(e.date))}<div class="small" style="font-family:var(--body);font-weight:600;color:#C9D4FF;margin-top:4px">${esc(countdown(e.date))}</div></div>`;
  let line = '';
  if(b && b.teams.length===2 && b.teams[0].lines.length){
    const away = b.teams.find(t=>t.homeAway==='away') || b.teams[0], hm = b.teams.find(t=>t!==away);
    const n = Math.max(away.lines.length, hm.lines.length);
    const hd = Array.from({length:n},(_,i)=> i<2 ? (i+1)+'H' : (i===2?'OT':'OT'+(i-1)));
    line = `<table class="linescore"><tr><th></th>${hd.map(h=>`<th>${h}</th>`).join('')}<th>T</th></tr>
      ${[away,hm].map(t=>`<tr><td>${esc(t.abbr||t.short)}</td>${Array.from({length:n},(_,i)=>`<td>${t.lines[i] ?? ''}</td>`).join('')}<td><b>${t.score}</b></td></tr>`).join('')}</table>`;
  }
  const where = [e.venue, e.city].filter(Boolean).join(' · ');
  return `<section class="board" aria-label="Scoreboard">
    <div class="board-status">${status}</div>
    <div class="board-row">
      <div class="bteam">${logoHTML(left.l,left.n)}<div class="rk">${left.r?'No. '+left.r:''}</div><div class="nm">${esc(left.n)}</div></div>
      ${center}
      <div class="bteam">${logoHTML(right.l,right.n)}<div class="rk">${right.r?'No. '+right.r:''}</div><div class="nm">${esc(right.n)}</div></div>
    </div>
    ${line}
    <div class="board-meta">${esc(where)}${e.tv ? ' · '+esc(e.tv) : ''}</div>
    ${compact ? '' : `<div class="board-actions">
      ${e.fallback ? '' : `<button class="btn primary" onclick="openGame('${e.id}')">${live?'Live box score':post?'Box score':'Game preview'}</button>`}
      <a class="btn" href="${yt('Kentucky vs '+e.opp.name+' basketball highlights '+new Date(e.date).getFullYear())}" target="_blank" rel="noopener">▶ Highlights</a>
    </div>`}
  </section>`;
}
function countdown(d){
  const ms = new Date(d) - Date.now(); if(ms < 0) return 'Tipping off';
  const h = Math.floor(ms/3600000), dd = Math.floor(h/24);
  if(dd >= 1) return `in ${dd} day${dd>1?'s':''}`;
  if(h >= 1) return `in ${h} hr ${Math.floor(ms%3600000/60000)} min`;
  return `in ${Math.max(1,Math.floor(ms/60000))} min`;
}

function glance(v,l){ return `<div class="stat"><b>${v}</b><span>${l}</span></div>`; }

function viewRoster(){

  let list = S.players.filter(p => {

    return true;
  });

const PCOLS = [
  ['name','Player'],['gp','GP'],['mpg','MIN'],['ppg','PTS'],['rpg','REB'],['apg','AST'],['spg','STL'],['bpg','BLK'],['tpg','TO'],
  ['fgp','FG%'],['tpp','3P%'],['ftp','FT%'],['tpm','3PM'],['fgm','FG'],['ftm','FT']
];
function pval(p,k){
  const t = p.tot, g = t.gp||0;
  switch(k){
    case 'name': return p.name; case 'gp': return g; case 'mpg': return g?t.min/g:0; case 'ppg': return g?t.pts/g:0; case 'rpg': return g?t.reb/g:0;
    case 'apg': return g?t.ast/g:0; case 'spg': return g?t.stl/g:0; case 'bpg': return g?t.blk/g:0; case 'tpg': return g?t.to/g:0;
    case 'fgp': return t.fga?t.fgm/t.fga:-1; case 'tpp': return t.tpa?t.tpm/t.tpa:-1; case 'ftp': return t.fta?t.ftm/t.fta:-1;
    case 'tpm': return t.tpm; case 'fgm': return t.fgm; case 'ftm': return t.ftm;
  }
}
function pfmt(p,k){
  const t = p.tot, g = t.gp||0;
  if(k==='name') return `<button class="pl" onclick="openPlayer('${esc(p.key)}')">${photoHTML(p,'',26)}${esc(p.name)}</button>`;
  if(k==='gp') return g; if(!g) return '–';
  if(k==='fgp') return pct(t.fgm,t.fga); if(k==='tpp') return pct(t.tpm,t.tpa); if(k==='ftp') return pct(t.ftm,t.fta);
  if(k==='tpm') return `${t.tpm}-${t.tpa}`; if(k==='fgm') return `${t.fgm}-${t.fga}`; if(k==='ftm') return `${t.ftm}-${t.fta}`;
  return pval(p,k).toFixed(1);
}

      ${S.events.filter(e=>S.box[e.id]?.teams?.length).map(e=>{ const t = S.box[e.id].teams.find(x=>x.id===TEAM_ID)?.totals; if(!t) return '';

const ACOLS = [
  ['name','Player'],['gp','GP'],['mpg','MIN'],['pm','+/-'],['pmpg','+/- per game'],['gmsc','Game score'],['ts','TS%'],['efg','eFG%'],['usg','USG%'],
  ['ast','AST%'],['tov','TOV%'],['astto','AST/TO'],['reb','REB%'],['orb','ORB%'],['drb','DRB%'],['stl','STL%'],['blk','BLK%'],
  ['tpar','3PA rate'],['ftr','FT rate'],['p40','PTS/40'],['r40','REB/40'],['a40','AST/40']

function aval(p,k){ if(k==='name') return p.name; if(k==='gp') return p.tot.gp; if(k==='mpg') return p.tot.gp ? p.tot.min/p.tot.gp : 0; const v = p.adv?.[k]; return v==null ? -1e9 : v; }
function afmt(p,k){
  if(k==='name') return `<button class="pl" onclick="openPlayer('${esc(p.key)}')">${photoHTML(p,'',26)}${esc(p.name)}</button>`;
  if(k==='gp') return p.tot.gp; if(!p.tot.gp) return '–';
  if(k==='mpg') return (p.tot.min/p.tot.gp).toFixed(1);

  if(k==='pm') return `<b class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${Math.round(v)}</b>`;
  if(k==='pmpg') return `<em class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${v.toFixed(1)}</em>`;
  if(k==='astto') return v.toFixed(2);

function advTable(){

function teamAdvPanel(a){

  const ortg = P ? a.us.pts/P*100 : 0, drtg = P ? a.them.pts/P*100 : 0;
  const pace = a.tmin ? P/(a.tmin/5)*40 : 0;
  const ff = t => ({efg:t.fga?(t.fgm+0.5*t.tpm)/t.fga*100:0, tov:(t.fga+0.44*t.fta+t.to)?t.to/(t.fga+0.44*t.fta+t.to)*100:0, ftr:t.fga?t.fta/t.fga*100:0, ts:(t.fga+0.44*t.fta)?t.pts/(2*(t.fga+0.44*t.fta))*100:0, astr:t.fgm?t.ast/t.fgm*100:0});
  const u = ff(a.us), o = ff(a.them);
  const orbU = (a.us.oreb+a.them.dreb) ? a.us.oreb/(a.us.oreb+a.them.dreb)*100 : 0, orbO = (a.them.oreb+a.us.dreb) ? a.them.oreb/(a.them.oreb+a.us.dreb)*100 : 0;

      const lead = (k) => [...uk.players].sort((a,c)=>c[k]-a[k])[0];
      const lo = (k) => [...(op?.players||[])].sort((a,c)=>c[k]-a[k])[0];
      html += `<h3 style="margin-top:16px">Game leaders</h3><div class="grid g2">${[['pts','Points'],['reb','Rebounds'],['ast','Assists']].map(([k,l])=>{ const a = lead(k), c = lo(k);
        return `<div class="panel"><div class="small muted" style="font-weight:700">${l}</div><div style="display:flex;justify-content:space-between;gap:8px;margin-top:4px"><span><b>${a?.[k]??'–'}</b> ${esc(a?.name||'')}</span><span class="muted">${esc(c?.name||'')} <b>${c?.[k]??''}</b></span></div></div>`; }).join('')}</div>`;
    }
  }
  else if(tab==='plays'){
    const home = b.teams.find(t=>t.homeAway==='home'), away = b.teams.find(t=>t.homeAway==='away');
    html += b.plays.length ? `<div class="plays">${b.plays.map(p=>`<div class="play ${p.scoring?'sc':''}">
      <span class="clk">${p.period?(p.period<=2?p.period+'H':'OT'):''} ${esc(p.clock||'')}</span><span>${esc(p.text)}</span>
      <span class="scr">${p.away!=null?`${p.away}–${p.home}`:''}</span></div>`).join('')}</div>
      <p class="small muted">Newest first · score shown ${esc(away?.abbr||'away')}–${esc(home?.abbr||'home')}</p>` : '<p class="muted small">Play-by-play isn’t available for this game.</p>';
  }
  else if(tab==='hl'){
    const yr = new Date(e.date).getFullYear();
    html += `<div class="links">
      <a class="btn yt" href="${yt('Kentucky vs '+e.opp.name+' basketball highlights '+yr)}" target="_blank" rel="noopener">▶ Full game highlights</a>
      <a class="btn yt" href="${yt('Kentucky Wildcats '+e.opp.short+' postgame Mark Pope')}" target="_blank" rel="noopener">▶ Postgame press conference</a>
      ${uk?.players?.length ? [...uk.players].sort((a,c)=>c.pts-a.pts).slice(0,3).map(p=>`<a class="btn yt" href="${yt(p.name+' vs '+e.opp.name+' highlights')}" target="_blank" rel="noopener">▶ ${esc(p.name)} (${p.pts} pts)</a>`).join('') : ''}
      <a class="btn xbtn" href="${xs('from:KentuckyMBB '+e.opp.short)}" target="_blank" rel="noopener">@KentuckyMBB clips</a>
      <a class="btn" href="https://www.espn.com/mens-college-basketball/game/_/gameId/${e.id}" target="_blank" rel="noopener">ESPN recap</a></div>`;
  }
  if(b.attendance) html += `<p class="small muted" style="margin-top:12px">Attendance ${Number(b.attendance).toLocaleString()}${b.venue?' at '+esc(b.venue):''}</p>`;
  return {title, html};
}

/* ============ EVENTS ============ */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  S.view = b.dataset.view; try{ location.hash = S.view; }catch(e){}
  render(); window.scrollTo(0,0);
}));
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(['home','roster','schedule','stats','staff'].includes(v) && v!==S.view){ S.view = v; render(); } });
document.addEventListener('keydown', e => { if(e.key==='Escape' && S.sheet) closeSheet(); });
$('#refreshBtn').addEventListener('click', hardRefresh);
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nx; try{ localStorage.setItem('ukmbb27:theme', nx); }catch(e){}
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && !S.loading) refreshLive(); });
async function hardRefresh(){ $('#refreshBtn').textContent='…'; await loadBoxScores(true).catch(()=>{}); await refreshLive(); $('#refreshBtn').textContent='⟳'; }

/* Install as an app */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').hidden = true; });
$('#installBtn').addEventListener('click', async () => { if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#installBtn').hidden = true; });
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

(function init(){
  try{ const t = localStorage.getItem('ukmbb27:theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
  const v = location.hash.slice(1); if(['home','roster','schedule','stats','staff'].includes(v)) S.view = v;
  render();
  loadAll().catch(err => { S.events = S.events.length ? S.events : fallbackEvents(); S.error = 'Live ESPN data didn’t load. Check your connection and refresh.'; build(); S.loading=false; render(); schedule(); });
})();
</script>
</body>
</html>
